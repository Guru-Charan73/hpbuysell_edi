_schema-version: 3.3.0
ID: hpbuysell_edilookup
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: hpbuysell_edilookup-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api 
        properties:
          srv-url: ${default-url}
    requires:
      - name: hpbuysell_edilookup-postgres
      - name: hpbuysell_edilookup-auth

  - name: hpbuysell_edilookup-postgres-deployer
    type: nodejs
    path: gen/pg
    parameters:
      buildpack: nodejs_buildpack
      no-route: true
      no-start: true
      tasks:
        - name: deploy-to-postgresql
          command: npm start
    requires:
      - name: hpbuysell_edilookup-postgres

resources:
  - name: hpbuysell_edilookup-postgres
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: ust-portfolio-db

  - name: hpbuysell_edilookup-auth
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: BTP-hpbuysell_btp_intgmont-xsuaa-service